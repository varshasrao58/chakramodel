name: Train ChakraTransformer on GPU

on:
  push:
    branches:
      - varshasrao58-compare-endovit-vit
  workflow_dispatch:
    inputs:
      runner:
        description: "GPU runner label configured for this repository or organization"
        required: true
        default: "ubuntu-24.04-gpu"
      epochs:
        description: "Number of training epochs"
        required: true
        default: "50"
      batch_size:
        description: "Per-device batch size"
        required: true
        default: "2"
      grad_accum:
        description: "Gradient accumulation steps"
        required: true
        default: "8"
      workers:
        description: "DataLoader workers"
        required: true
        default: "2"

permissions:
  contents: read

concurrency:
  group: chakra-transformer-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    name: Train ChakraTransformer
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 1440

    steps:
      - name: Checkout ChakraModel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "timm==0.9.16"

      - name: Verify NVIDIA GPU
        run: |
          nvidia-smi
          python -c "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))"

      - name: Prepare Kvasir-SEG
        run: python src/download_kvasir.py

      - name: Restore latest checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: weights/chakra_transformer_latest.pth
          key: chakra-transformer-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            chakra-transformer-${{ github.ref_name }}-

      - name: Train
        run: |
          RESUME=""
          if [ -f weights/chakra_transformer_latest.pth ]; then
            RESUME="--resume weights/chakra_transformer_latest.pth"
          fi
          python src/chakra_transformer/train_transformer.py \
            --epochs "${{ inputs.epochs }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --grad-accum "${{ inputs.grad_accum }}" \
            --workers "${{ inputs.workers }}" \
            $RESUME

      - name: Write training summary
        if: always()
        run: |
          {
            echo "## ChakraTransformer GPU training"
            echo ""
            echo "- Runner: \`${{ inputs.runner }}\`"
            echo "- Epochs: \`${{ inputs.epochs }}\`"
            echo "- Effective batch size: \`${{ inputs.batch_size }} x ${{ inputs.grad_accum }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload best checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chakra-transformer-best-${{ github.run_number }}
          path: weights/chakra_transformer_best.pth
          if-no-files-found: warn
          retention-days: 30

      - name: Upload latest checkpoint for resume
        if: always() && hashFiles('weights/chakra_transformer_latest.pth') != ''
        uses: actions/cache/save@v4
        with:
          path: weights/chakra_transformer_latest.pth
          key: chakra-transformer-${{ github.ref_name }}-${{ github.run_id }}
